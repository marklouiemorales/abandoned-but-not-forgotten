<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  function showErr(m){
    var d=document.createElement('pre');
    d.style.cssText='position:fixed;z-index:99999;top:0;left:0;right:0;margin:0;padding:12px;background:#400;color:#fff;font:14px monospace;white-space:pre-wrap';
    d.textContent=m; document.documentElement.appendChild(d);
  }
  window.addEventListener('error',function(e){showErr('ERROR: '+(e.message||(e.target&&(e.target.src||e.target.href))||'unknown')+' '+(e.filename||'')+':'+(e.lineno||''));},true);
  window.addEventListener('unhandledrejection',function(e){showErr('PROMISE: '+((e.reason&&e.reason.stack)||e.reason));});
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abandoned But Not Forgotten - NASA Space Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Orbitron = dialogue UI, Inter = ship intro (logo fallback, Start journey, footer) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

  <div id="moon-container" style="width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000;"> </div>

  <!-- UI HUD Overlays -->
  <div id="ui-container">
    <div id="registration-overlay" class="ui-panel"></div>
    <div id="dialogue-overlay" class="hud-box hidden"></div>
    <div id="radar-hud" class="radar-container hidden"></div>
    <div id="emergency-brake-modal" class="warning-screen hidden"></div>
    <div id="archive-modal" class="popup-modal hidden"></div>
    <div id="certificate-modal" class="modal-overlay hidden"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
