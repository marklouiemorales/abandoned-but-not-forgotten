<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Abandoned But Not Forgotten - NASA Space Apps</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />

  <style>
    #rotate-hint {
      display: none;
      position: fixed; inset: 0; z-index: 100000;
      align-items: center; justify-content: center; text-align: center;
      background: #000; color: rgba(255, 255, 255, .85);
      font-family: 'Orbitron', sans-serif; font-weight: 500;
      font-size: 11px; letter-spacing: .14em; line-height: 1.8;
    }
    #rotate-hint svg {
      display: block; width: 44px; height: 44px; margin: 0 auto 14px;
      fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      animation: rhTurn 2.4s ease-in-out infinite;
    }
    #rotate-hint p { margin: 0; }
    @keyframes rhTurn {
      0%, 25% { transform: rotate(0deg); }
      65%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (max-width: 820px) {
      #rotate-hint { display: flex; }
    }
  </style>
</head>
<body>

  <div id="moon-container" style="width: 100%; height: 100dvh; position: relative; overflow: hidden; background: #000; touch-action: none;"></div>

  <!-- UI HUD Overlays -->
  <div id="ui-container">
    <div id="registration-overlay" class="ui-panel"></div>
    <div id="dialogue-overlay" class="hud-box hidden"></div>
    <div id="radar-hud" class="radar-container hidden"></div>
    <div id="emergency-brake-modal" class="warning-screen hidden"></div>
    <div id="archive-modal" class="popup-modal hidden"></div>
    <div id="certificate-modal" class="modal-overlay hidden"></div>
  </div>

  <div id="rotate-hint">
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2" />
        <line x1="10.5" y1="18.5" x2="13.5" y2="18.5" />
      </svg>
      <p>ROTATE YOUR PHONE TO LANDSCAPE</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
